        $ref: '#/definitions/colortheme.Response'
      ui_tours:
        additionalProperties:
          type: boolean
        type: object
      updated:
        type: integer
    type: object
  action.Parameters:
    properties:
      auth_token:
        $ref: '#/definitions/request.WebhookAuthToken'
        description: AuthToken is used in webhook action.
      author:
        type: string
      color:
        description: Color is used in pbehavior action.
        type: string
      declare_ticket:
        $ref: '#/definitions/request.WebhookDeclareTicket'
        description: DeclareTicket is used in webhook action.
