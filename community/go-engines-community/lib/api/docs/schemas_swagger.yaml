        description: SkipForChild is used in webhook action.
        type: boolean
      skip_for_instruction:
        description: SkipForInstruction is used in webhook action.
        type: boolean
      start_on_trigger:
        description: StartOnTrigger is used in pbehavior action.
        type: boolean
      state:
        description: |-
          State is used in changestate action.
            * `0` - Info
            * `1` - Minor
            * `2` - Major
            * `3` - Critical
        type: integer
      stop_on_fail:
        description: StopOnFail is used in webhook action.
        type: boolean
      stop_on_success:
        description: StopOnSuccess is used in webhook action.
        type: boolean
      ticket:
        description: Ticket is used in assocticket action.
        maxLength: 255
        type: string
      ticket_data:
        additionalProperties:
          type: string
        description: TicketData is used in assocticket action.
        type: object
      ticket_system_name:
        description: TicketSystemName is used in assocticket and webhook action.
        maxLength: 255
        type: string
      ticket_url:
        description: TicketURL is used in assocticket action.
        maxLength: 255
        type: string
      ticket_url_title:
        description: TicketURLTitle is used in assocticket action.
        maxLength: 255
        type: string
      tstart:
        description: Tstart is used in pbehavior action.
        type: integer
      tstop:
        description: Tstop is used in pbehavior action.
        type: integer
      type:
        description: Type is used in pbehavior action.
        type: string
