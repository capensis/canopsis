components:
  parameters:
    id:
      name: id
      in: path
      description: resource id
      required: true
      schema:
        type: string
    page:
      name: page
      in: query
      description: current page number
      required: false
      schema:
        type: integer
        minimum: 1
    limit:
      name: limit
      in: query
      description: number of items per page
      required: false
      schema:
        type: integer
        minimum: 1
    sort:
      name: sort
      in: query
      description: |
        Comma separated list of `field:direction`, applied in order.
        
        The direction is `asc` or `desc`, and may be omitted to sort ascending.
        The fields which can be sorted on depend on the endpoint.
      schema:
        type: string
      example: name:asc,created:desc
    author:
      name: author
      in: query
      description: filter by author
      schema:
        type: string
    resolution:
      name: resolution
      in: query
      required: true
      description: search the open alarms or the resolved ones
      schema:
        type: string
        enum:
          - open
          - resolved

  schemas:
    event.Event:
      type: object
      required:
        - connector
        - connector_name
        - component
        - event_type
        - source_type
      properties:
        component:
          type: string
        connector:
          type: string
        connector_name:
          type: string
        event_type:
          type: string
          enum:
            - check
            - ack
            - ackremove
            - cancel
            - uncancel
            - comment
            - snooze
            - changestate
            - assocticket
            - declareticket
        resource:
          type: string
        source_type:
          type: string
          enum:
            - resource
            - component
        state:
          type: integer
          enum:
            - 0
            - 1
            - 2
            - 3
          description: >
            State:
              * `0` - Info
              * `1` - Minor
              * `2` - Major
              * `3` - Critical
        output:
          type: string
        long_output:
          type: string
        author:
          type: string
        user_id:
          type: string
        duration:
          type: integer
    event.Response:
      type: object
      properties:
        failed_events:
          type: array
          items:
            $ref: '#/components/schemas/event.Event'
        retry_events:
          type: array
          items:
            $ref: '#/components/schemas/event.Event'
        sent_events:
          type: array
          items:
            $ref: '#/components/schemas/event.Event'
    ListResponse:
      type: object
      properties:
        data:
          type: array
        meta:
          type: object
          properties:
            page:
              type: integer
            page_count:
              type: integer
            per_page:
              type: integer
            total_count:
              type: integer
    BulkResponseItem:
      type: object
      properties:
        id:
          type: string
        status:
          type: integer
        error:
          type: string
        errors:
          type: object
          additionalProperties:
            type: string
    ErrorResponse:
      properties:
        error:
          type: string
        message:
          type: string
      type: object

    NoContent:
      description: No Content
    NotFound:
      description: Not Found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: "Not Found"
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: "Unauthorized"
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: "Forbidden"
            message: "The admin role cannot be deleted."
    RequestEntityTooLarge:
      description: RequestEntityTooLarge
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: "Request Entity Too Large"
    Conflict:
      description: Conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: "Conflict"
            message: "The type cannot be deleted because it is referenced by a pbehavior."
    BadRequest:
      description: Bad Request
      content:
        application/json:
          schema:
            properties:
              errors:
                additionalProperties:
                  type: string
                type: object
            type: object
          example:
            errors:
              name: "The field already exists"
              enabled: "The field is a required field"

  securitySchemes:
    TokenAuth:
      type: http
      scheme: bearer
      bearerFormat: API token
      description: >
        An API token, sent as `Authorization: Bearer <token>`.

        Tokens are created from the Canopsis interface, or by `POST /internal/api-tokens` on the internal API.

security:
  - TokenAuth: [ ]
