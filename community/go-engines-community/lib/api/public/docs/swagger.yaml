openapi: 3.0.1

info:
  title: Canopsis Community Public API
  description: This is a Canopsis Community Public API.
  version: latest
  license:
    name: GNU AGPLv3
    url: https://www.gnu.org/licenses/agpl-3.0.html

servers:
  - url: /api/v5

paths:
  /alarms:
    get:
      tags:
        - alarms
      summary: Find all alarms
      description: |
        Get paginated list of alarms.

        -  PERMISSIONS: `api_alarm_read`
      operationId: alarms-find-all
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/sort'
        - $ref: '#/components/parameters/resolution'
        - name: search
          in: query
          description: full text search
          schema:
            type: string
            maxLength: 10000
        - name: search_by
          in: query
          style: form
          explode: true
          description: restrict the full text search to these fields
          schema:
            type: array
            items:
              type: string
        - name: type
          in: query
          style: form
          explode: true
          description: filter by alarm types
          schema:
            type: array
            uniqueItems: true
            items:
              type: string
              enum:
                - standalone
                - meta
                - grouped
        - name: meta_alarm
          in: query
          style: form
          explode: true
          description: filter by ids of the meta alarms the returned ones are grouped into
          schema:
            type: array
            items:
              type: string
        - name: tag
          in: query
          style: form
          explode: true
          description: filter by alarm tags
          schema:
            type: array
            items:
              type: string
        - name: time_field
          in: query
          description: the date the `from` and `to` interval applies to, required with them
          schema:
            type: string
            enum:
              - creation_date
              - resolved
              - activation_date
              - last_event_date
              - last_update_date
              - last_st_upd_dt
        - name: from
          in: query
          description: filter by alarms whose `time_field` is after this timestamp
          schema:
            type: integer
        - name: to
          in: query
          description: filter by alarms whose `time_field` is before this timestamp
          schema:
            type: integer
        - name: entity_type
          in: query
          style: form
          explode: true
          description: filter by the types of the alarm entities
          schema:
            type: array
            items:
              type: string
              enum:
                - connector
                - component
                - resource
                - service
        - name: entity_category
          in: query
          style: form
          explode: true
          description: filter by the category ids of the alarm entities
          schema:
            type: array
            items:
              type: string
        - name: entity_connector
          in: query
          style: form
          explode: true
          description: filter by the connector ids of the alarm entities
          schema:
            type: array
            items:
              type: string
        - name: entity_component
          in: query
          style: form
          explode: true
          description: filter by the component ids of the alarm entities
          schema:
            type: array
            items:
              type: string
        - name: entity_upstream
          in: query
          style: form
          explode: true
          description: filter by ids of the entities which depend on the alarm entities
          schema:
            type: array
            items:
              type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ListResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: 'schemas_swagger.yaml#/definitions/alarm.Response'
        '400':
          $ref: '#/components/schemas/BadRequest'
        '401':
          $ref: '#/components/schemas/Unauthorized'
        '403':
          $ref: '#/components/schemas/Forbidden'

  /alarms/search:
    post:
      tags:
        - alarms
      summary: Search alarms
      description: |
        Get paginated list of alarms matching a pattern.

        -  PERMISSIONS: `api_alarm_read`
      operationId: alarms-search
      requestBody:
        description: body
        content:
          application/json:
            schema:
              $ref: 'schemas_swagger.yaml#/definitions/alarm.SearchRequest'
            examples:
              critical:
                summary: Critical alarms of a component
                description: Find the open critical alarms of one component
                value: {
                  "page": 1,
                  "limit": 100,
                  "resolution": "open",
                  "sort": "creation_date:desc",
                  "alarm_pattern": [
                    [
                      {
                        "field": "v.state.val",
                        "cond": {
                          "type": "eq",
                          "value": 3
                        }
                      }
                    ]
                  ],
                  "entity_pattern": [
                    [
                      {
                        "field": "component",
                        "cond": {
                          "type": "eq",
                          "value": "cps_component"
                        }
                      }
                    ]
                  ]
                }
              paused:
                summary: Paused alarms
                description: Find the alarms which are under a pause pbehavior type
                value: {
                  "resolution": "open",
                  "pbehavior_pattern": [
                    [
                      {
                        "field": "canonical_type",
                        "cond": {
                          "type": "eq",
                          "value": "pause"
                        }
                      }
                    ]
                  ]
                }
              resolved:
                summary: Resolved alarms
                description: Find the resolved alarms which have been acknowledged
                value: {
                  "resolution": "resolved",
                  "types": [ "standalone" ],
                  "alarm_pattern": [
                    [
                      {
                        "field": "v.ack",
                        "cond": {
                          "type": "exist",
                          "value": true
                        }
                      }
                    ]
                  ]
                }
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ListResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: 'schemas_swagger.yaml#/definitions/alarm.Response'
        '400':
          $ref: '#/components/schemas/BadRequest'
        '401':
          $ref: '#/components/schemas/Unauthorized'
        '403':
          $ref: '#/components/schemas/Forbidden'

  /alarms/{id}/steps:
    get:
      tags:
        - alarms
      summary: Find the steps of an alarm
      description: |
        Get paginated list of the steps of one alarm.

        -  PERMISSIONS: `api_alarm_read`
      operationId: alarms-find-steps
      parameters:
        - $ref: '#/components/parameters/id'
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/sort'
        - name: type
          in: query
          style: form
          explode: true
          description: filter by step types
          schema:
            type: array
            items:
              type: string
              enum:
                - stateinc
                - statedec
                - statusinc
                - statusdec
                - ack
                - ackremove
                - comment
                - snooze
                - unsnooze
                - statecounter
                - changestate
                - pbhenter
                - pbhleave
                - metaalarmattach
                - metaalarmdetach
                - activate
                - resolve
                - assocticket
                - ticketremove
                - declareticket
                - declareticketfail
                - webhookstart
                - webhookcomplete
                - webhookfail
                - instructionstart
                - instructionpause
                - instructionresume
                - instructioncomplete
                - instructionfail
                - instructionabort
                - autoinstructionstart
                - autoinstructioncomplete
                - autoinstructionfail
                - junittestsuiteupdate
                - junittestcaseupdate
                - changeticketstatus
        - name: initiator
          in: query
          style: form
          explode: true
          description: filter by step initiators
          schema:
            type: array
            uniqueItems: true
            items:
              type: string
              enum:
                - user
                - external
                - system
        - name: from
          in: query
          description: filter by steps which are after this timestamp
          schema:
            type: integer
        - name: to
          in: query
          description: filter by steps which are before this timestamp
          schema:
            type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ListResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: 'schemas_swagger.yaml#/definitions/alarm.Step'
        '400':
          $ref: '#/components/schemas/BadRequest'
        '404':
          $ref: '#/components/schemas/NotFound'
        '401':
          $ref: '#/components/schemas/Unauthorized'
        '403':
          $ref: '#/components/schemas/Forbidden'

  /alarm-exports:
    post:
      tags:
        - alarm-exports
      summary: Start an alarm export
      description: |
        Start an export of the alarms matching a pattern.

        The export runs in the background: this returns a job, whose progress is followed with
        `GET /alarm-exports/{id}` and whose result is fetched with `GET /alarm-exports/{id}/download` once
        its status is `done`.

        -  PERMISSIONS: `api_alarm_read`
      operationId: alarm-exports-create
      requestBody:
        description: body
        content:
          application/json:
            schema:
              $ref: 'schemas_swagger.yaml#/definitions/alarmexport.Request'
            examples:
              csv:
                summary: CSV
                description: Export to a semicolon separated csv
                value: {
                  "format": "csv",
                  "delimiter": "semicolon",
                  "time_format": "DD MMM YYYY hh:mm:ss ZZ",
                  "resolution": "open",
                  "sort": "creation_date:desc",
                  "fields": [
                    { "name": "_id", "label": "ID" },
                    { "name": "display_name", "label": "Name" },
                    { "name": "entity.name", "label": "Entity" },
                    { "name": "state.val", "label": "State" },
                    { "name": "creation_date", "label": "Created" }
                  ],
                  "alarm_pattern": [
                    [
                      {
                        "field": "v.state.val",
                        "cond": {
                          "type": "eq",
                          "value": 3
                        }
                      }
                    ]
                  ]
                }
              json:
                summary: JSON
                description: Export the infos of every resolved alarm to json
                value: {
                  "format": "json",
                  "resolution": "resolved",
                  "fields": [
                    { "name": "_id", "label": "ID" },
                    { "name": "infos", "label": "Infos" },
                    { "name": "entity.infos.my_info.value", "label": "My info" }
                  ]
                }
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: 'schemas_swagger.yaml#/definitions/asyncjob.Response'
        '400':
          $ref: '#/components/schemas/BadRequest'
        '401':
          $ref: '#/components/schemas/Unauthorized'
        '403':
          $ref: '#/components/schemas/Forbidden'
  /alarm-exports/{id}:
    get:
      tags:
        - alarm-exports
      summary: Get an alarm export by id
      description: |
        Get the status of an export job.

        Poll it until the status is `done` or `failed`.

        -  PERMISSIONS: `api_alarm_read`
      operationId: alarm-exports-get-by-id
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: 'schemas_swagger.yaml#/definitions/asyncjob.Response'
        '404':
          $ref: '#/components/schemas/NotFound'
        '401':
          $ref: '#/components/schemas/Unauthorized'
        '403':
          $ref: '#/components/schemas/Forbidden'
  /alarm-exports/{id}/download:
    get:
      tags:
        - alarm-exports
      summary: Download an alarm export by id
      description: |
        Download the file produced by an export job.

        The job must be `done`: not found is returned while it's still running, or if it failed.

        -  PERMISSIONS: `api_alarm_read`
      operationId: alarm-exports-download
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: OK
          headers:
            Content-Disposition:
              description: attachment, with the generated file name
              schema:
                type: string
          content:
            text/csv:
              schema:
                type: string
                format: binary
            application/json:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/schemas/NotFound'
        '401':
          $ref: '#/components/schemas/Unauthorized'
        '403':
          $ref: '#/components/schemas/Forbidden'

  /event:
    post:
      tags:
        - events
      summary: Send event/events
      description: |
        Send event/events.

        - PERMISSIONS: `api_event`
      operationId: event-send
      requestBody:
        description: body
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/event.Event'
            examples:
              check:
                summary: Check
                description: Update a state of an alarm.
                value: {
                  "event_type": "check",
                  "connector": "cps_connector",
                  "connector_name": "cps_connector_name",
                  "component": "cps_component",
                  "resource": "cps_resource",
                  "source_type": "resource",
                  "state": 3,
                  "output": "Lorem ipsum dolor sit amet",
                  "long_output": "Lorem ipsum dolor sit amet, consectetur adipiscing elit."
                }
              ack:
                summary: Ack
                description: Acknowledge an alarm.
                value: {
                  "event_type": "ack",
                  "connector": "cps_connector",
                  "connector_name": "cps_connector_name",
                  "component": "cps_component",
                  "resource": "cps_resource",
                  "source_type": "resource",
                  "author": "root",
                  "user_id": "root",
                  "output": "Lorem ipsum dolor sit amet"
                }
              ackremove:
                summary: Ack remove
                description: Unacknowledge an alarm.
                value: {
                  "event_type": "ackremove",
                  "connector": "cps_connector",
                  "connector_name": "cps_connector_name",
                  "component": "cps_component",
                  "resource": "cps_resource",
                  "source_type": "resource",
                  "author": "root",
                  "user_id": "root",
                  "output": "Lorem ipsum dolor sit amet"
                }
              cancel:
                summary: Cancel
                description: Cancel an alarm.
                value: {
                  "event_type": "cancel",
                  "connector": "cps_connector",
                  "connector_name": "cps_connector_name",
                  "component": "cps_component",
                  "resource": "cps_resource",
                  "source_type": "resource",
                  "author": "root",
                  "user_id": "root",
                  "output": "Lorem ipsum dolor sit amet"
                }
              uncancel:
                summary: Uncancel
                description: Uncancel an alarm.
                value: {
                  "event_type": "uncancel",
                  "connector": "cps_connector",
                  "connector_name": "cps_connector_name",
                  "component": "cps_component",
                  "resource": "cps_resource",
                  "source_type": "resource",
                  "author": "root",
                  "user_id": "root",
                  "output": "Lorem ipsum dolor sit amet"
                }
              comment:
                summary: Comment
                description: Add new comment to an alarm.
                value: {
                  "event_type": "comment",
                  "connector": "cps_connector",
                  "connector_name": "cps_connector_name",
                  "component": "cps_component",
                  "resource": "cps_resource",
                  "source_type": "resource",
                  "author": "root",
                  "user_id": "root",
                  "output": "Lorem ipsum dolor sit amet"
                }
              snooze:
                summary: Snooze
                description: Snooze an alarm for duration (in seconds).
                value: {
                  "event_type": "snooze",
                  "connector": "cps_connector",
                  "connector_name": "cps_connector_name",
                  "component": "cps_component",
                  "resource": "cps_resource",
                  "source_type": "resource",
                  "author": "root",
                  "user_id": "root",
                  "output": "Lorem ipsum dolor sit amet",
                  "duration": 600
                }
              changestate:
                summary: Change state
                description: Change a state of an alarm. Following check events won't update the state.
                value: {
                  "event_type": "changestate",
                  "connector": "cps_connector",
                  "connector_name": "cps_connector_name",
                  "component": "cps_component",
                  "resource": "cps_resource",
                  "source_type": "resource",
                  "author": "root",
                  "user_id": "root",
                  "output": "Lorem ipsum dolor sit amet",
                  "state": 3
                }
              assocticket:
                summary: Associate ticket
                description: Add new ticket to an alarm.
                value: {
                  "event_type": "assocticket",
                  "connector": "cps_connector",
                  "connector_name": "cps_connector_name",
                  "component": "cps_component",
                  "resource": "cps_resource",
                  "source_type": "resource",
                  "author": "root",
                  "user_id": "root",
                  "ticket": "ENV-116",
                  "ticket_url": "https://jira.local/ENV-116",
                  "ticket_system_name": "Jira",
                  "ticket_data": {
                    "priority": "high",
                    "tag": "env"
                  },
                  "ticket_comment": "Lorem ipsum dolor sit amet"
                }
              declareticket:
                summary: Declare ticket
                description: Emit a trigger. A scenario can be started on the trigger.
                value: {
                  "event_type": "declareticket",
                  "connector": "cps_connector",
                  "connector_name": "cps_connector_name",
                  "component": "cps_component",
                  "resource": "cps_resource",
                  "source_type": "resource"
                }
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/event.Response'
        '400':
          $ref: '#/components/schemas/BadRequest'
        '401':
          $ref: '#/components/schemas/Unauthorized'
        '403':
          $ref: '#/components/schemas/Forbidden'

  /entities:
    get:
      tags:
        - entities
      summary: Find all entities
      description: |
        Get paginated list of entities.

        -  PERMISSIONS: `api_entity:read`
      operationId: entities-find-all
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/sort'
        - name: search
          in: query
          description: full text search
          schema:
            type: string
        - name: search_by
          in: query
          style: form
          explode: true
          description: restrict the full text search to these fields
          schema:
            type: array
            items:
              type: string
        - name: enabled
          in: query
          description: filter by enabled state
          schema:
            type: boolean
        - name: type
          in: query
          style: form
          explode: true
          description: filter by entity types
          schema:
            type: array
            items:
              type: string
              enum:
                - connector
                - component
                - resource
                - service
        - name: category
          in: query
          style: form
          explode: true
          description: filter by category ids
          schema:
            type: array
            items:
              type: string
        - name: connector
          in: query
          style: form
          explode: true
          description: filter by connector ids
          schema:
            type: array
            items:
              type: string
        - name: component
          in: query
          style: form
          explode: true
          description: filter by component ids
          schema:
            type: array
            items:
              type: string
        - name: upstream
          in: query
          style: form
          explode: true
          description: filter by ids of the entities which depend on the returned ones
          schema:
            type: array
            items:
              type: string
        - name: import_source
          in: query
          description: filter by the source of the import which created the entity
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ListResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: 'schemas_swagger.yaml#/definitions/entity.Response'
        '400':
          $ref: '#/components/schemas/BadRequest'
        '401':
          $ref: '#/components/schemas/Unauthorized'
        '403':
          $ref: '#/components/schemas/Forbidden'

  /entities/search:
    post:
      tags:
        - entities
      summary: Search entities
      description: |
        Get paginated list of entities matching a pattern.

        -  PERMISSIONS: `api_entity:read`
      operationId: entities-search
      requestBody:
        description: body
        content:
          application/json:
            schema:
              $ref: 'schemas_swagger.yaml#/definitions/entity.SearchRequest'
            examples:
              resources:
                summary: Resources of a component
                description: Find the enabled resources of one component
                value: {
                  "page": 1,
                  "limit": 100,
                  "enabled": true,
                  "sort": "name:asc",
                  "entity_pattern": [
                    [
                      {
                        "field": "component",
                        "cond": {
                          "type": "eq",
                          "value": "cps_component"
                        }
                      }
                    ]
                  ]
                }
              paused:
                summary: Paused entities
                description: Find the entities which are under a pause pbehavior type
                value: {
                  "pbehavior_pattern": [
                    [
                      {
                        "field": "canonical_type",
                        "cond": {
                          "type": "eq",
                          "value": "pause"
                        }
                      }
                    ]
                  ]
                }
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ListResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: 'schemas_swagger.yaml#/definitions/entity.Response'
        '400':
          $ref: '#/components/schemas/BadRequest'
        '401':
          $ref: '#/components/schemas/Unauthorized'
        '403':
          $ref: '#/components/schemas/Forbidden'

  /entity-exports:
    post:
      tags:
        - entity-exports
      summary: Start an entity export
      description: |
        Start an export of the entities matching a pattern.

        The export runs in the background: this returns a job, whose progress is followed with
        `GET /entity-exports/{id}` and whose result is fetched with `GET /entity-exports/{id}/download` once
        its status is `done`.

        -  PERMISSIONS: `api_entity:read`
      operationId: entity-exports-create
      requestBody:
        description: body
        content:
          application/json:
            schema:
              $ref: 'schemas_swagger.yaml#/definitions/entityexport.Request'
            examples:
              csv:
                summary: CSV
                description: Export to a semicolon separated csv
                value: {
                  "format": "csv",
                  "delimiter": "semicolon",
                  "time_format": "DD MMM YYYY hh:mm:ss ZZ",
                  "fields": [
                    { "name": "_id", "label": "ID" },
                    { "name": "name", "label": "Name" },
                    { "name": "type", "label": "Type" },
                    { "name": "created", "label": "Created" }
                  ],
                  "entity_pattern": [
                    [
                      {
                        "field": "type",
                        "cond": {
                          "type": "eq",
                          "value": "resource"
                        }
                      }
                    ]
                  ]
                }
              json:
                summary: JSON
                description: Export the infos of every entity to json
                value: {
                  "format": "json",
                  "fields": [
                    { "name": "_id", "label": "ID" },
                    { "name": "infos", "label": "Infos" },
                    { "name": "infos.my_info.value", "label": "My info" }
                  ]
                }
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: 'schemas_swagger.yaml#/definitions/asyncjob.Response'
        '400':
          $ref: '#/components/schemas/BadRequest'
        '401':
          $ref: '#/components/schemas/Unauthorized'
        '403':
          $ref: '#/components/schemas/Forbidden'
  /entity-exports/{id}:
    get:
      tags:
        - entity-exports
      summary: Get an entity export by id
      description: |
        Get the status of an export job.

        Poll it until the status is `done` or `failed`.

        -  PERMISSIONS: `api_entity:read`
      operationId: entity-exports-get-by-id
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: 'schemas_swagger.yaml#/definitions/asyncjob.Response'
        '404':
          $ref: '#/components/schemas/NotFound'
        '401':
          $ref: '#/components/schemas/Unauthorized'
        '403':
