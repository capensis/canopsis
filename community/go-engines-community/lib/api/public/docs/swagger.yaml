  /entity-imports:
    post:
      tags:
        - entity-imports
      summary: Start an entity import
      description: |
        Import entities from the request body.

        The import runs in the background: this returns a job, whose progress is followed
        with `GET /entity-imports/{id}`.

        Only one import runs at a time, so a job can stay `pending` while another one is ongoing.

        -  PERMISSIONS: `api_entity:create`
      operationId: entity-imports-create
      parameters:
        - name: source
          in: query
          required: true
          description: name of the system the entities come from, stored on every imported entity
          schema:
            type: string
      requestBody:
        description: the entities to import
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: 'schemas_swagger.yaml#/definitions/entityimport.RequestItem'
            examples:
              set:
                summary: Set
                description: Create or update a component and one of its resources
                value: [
                  {
                    "action": "set",
                    "name": "cps_component",
                    "type": "component",
                    "enabled": true,
                    "infos": {
                      "location": {
                        "description": "Datacenter",
                        "value": "eu-west-1"
                      }
                    }
                  },
                  {
                    "action": "set",
                    "name": "cps_resource",
                    "component": "cps_component",
                    "type": "resource",
                    "enabled": true
                  }
                ]
              service:
                summary: Service
                description: Create a service from an entity pattern
                value: [
                  {
                    "action": "set",
                    "name": "cps_service",
                    "type": "service",
                    "enabled": true,
                    "output_template": "Dependencies: {{ .All }}",
                    "entity_pattern": [
                      [
                        {
                          "field": "infos.cps_info",
                          "field_type": "string",
                          "cond": {
                            "type": "eq",
                            "value": "cps_test"
                          }
                        }
                      ]
                    ]
                  }
                ]
              disable:
                summary: Disable and delete
                description: Disable a component and delete a resource
                value: [
                  {
                    "action": "disable",
                    "name": "cps_component",
                    "type": "component"
                  },
                  {
                    "action": "delete",
                    "name": "cps_resource",
                    "component": "cps_component",
                    "type": "resource"
                  }
                ]
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: 'schemas_swagger.yaml#/definitions/asyncjob.Response'
        '400':
          $ref: '#/components/schemas/BadRequest'
        '401':
          $ref: '#/components/schemas/Unauthorized'
        '403':
          $ref: '#/components/schemas/Forbidden'
        '413':
          $ref: '#/components/schemas/RequestEntityTooLarge'
  /entity-imports/{id}:
