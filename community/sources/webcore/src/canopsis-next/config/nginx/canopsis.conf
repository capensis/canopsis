server_tokens off;
absolute_redirect off; # preserve port forwarding

# Canopsis CSS/JS files have unique hashes in each official build.
# Add a bit of cache to some other static elements as well, but don't
# cache other resources.
map_hash_bucket_size 64;
map $sent_http_content_type $expires_time {
        default                         epoch;
        text/css                        1d;
        application/javascript          1d;
        application/vnd.ms-fontobject   1d;
        font/ttf                        1d;
        font/woff                       1d;
        font/woff2                      1d;
        image/vnd.microsoft.icon        1d;
        image/x-icon                    1d;
        image/gif                       1h;
        image/png                       1h;
}

include /etc/nginx/resolvers.inc;

server {
        listen 8080;
        listen [::]:8080;

        root /opt/canopsis/srv/www/;

        set $canopsis_internal_api_url http://127.0.0.1:8082; # see /etc/nginx/resolvers.inc if you modify this
        set $canopsis_public_api_url http://127.0.0.1:8083; # see /etc/nginx/resolvers.inc if you modify this
        set $canopsis_server_name localhost;
        server_name $canopsis_server_name;

        # Uncomment the next line to enable HTTPS
        #include /etc/nginx/https.inc;

        # Work around issue canopsis#1858
        client_max_body_size 7m;
        large_client_header_buffers 4 20k;

        gzip on;
        gzip_comp_level 4;
        gzip_min_length 1100;
        gzip_proxied any;
        gzip_vary on;
        gzip_types
                text/plain text/css
                application/javascript application/json application/xml
                image/bmp image/svg+xml image/vnd.microsoft.icon image/x-icon;

        expires $expires_time;

        # This old URL mustn't be used anymore
        location = /en/static/canopsis-next/dist/index.html {
                return 301 /;
        }

        # /internal/ws is like /internal below, but it needs websocket upgrades as well
        # (and thus, HTTPS if you effectively use this)
        # /api/v4/ws is kept as an alias of /internal/ws during the migration
        location ~ ^/(internal|api/v4)/ws$ {
                include /etc/nginx/cors.inc;
                proxy_pass $canopsis_internal_api_url/internal/ws$is_args$args;
                proxy_set_header X-Canopsis-API-Call-Origin 'nginx';
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_read_timeout 90s;
                proxy_http_version 1.1;
                # Never cache API calls
                proxy_no_cache 1;
                proxy_cache_bypass 1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection "Upgrade";
        }

        # Redirect internal API calls to canopsis-internal-api
        location ~ ^/internal {
                include /etc/nginx/cors.inc;
                proxy_pass $canopsis_internal_api_url;
                proxy_set_header X-Canopsis-API-Call-Origin 'nginx';
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_read_timeout 90s;
                proxy_http_version 1.1;
                # Never cache API calls
                proxy_no_cache 1;
                proxy_cache_bypass 1;
        }

        # Redirect public API calls to canopsis-public-api
        location ~ ^/api/v5 {
                proxy_pass $canopsis_public_api_url;
                proxy_set_header X-Canopsis-API-Call-Origin 'nginx';
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_read_timeout 90s;
                proxy_http_version 1.1;
                # Never cache API calls
                proxy_no_cache 1;
                proxy_cache_bypass 1;
        }

        # Temporary: /api/v4 is rewritten to /internal on canopsis-internal-api
        # during the migration to the public API
        location ~ ^/api/v4/(.*)$ {
                include /etc/nginx/cors.inc;
                proxy_pass $canopsis_internal_api_url/internal/$1$is_args$args;
                proxy_set_header X-Canopsis-API-Call-Origin 'nginx';
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_read_timeout 90s;
                proxy_http_version 1.1;
                # Never cache API calls
                proxy_no_cache 1;
                proxy_cache_bypass 1;
        }

        # Uncomment the next line to enable rundeck
        #include /etc/nginx/rundeck.inc;
        
        # Serve static files directly, but only if they exist. Otherwise, return 404.
        location ~ \.\w+$ {
                include /etc/nginx/cors.inc;
                try_files $uri =404;
        }

        # Serve index.html for all other requests, so that the SPA can handle routing.
        location / {
                try_files $uri $uri/ /index.html;
        }
}
